name: Trigger Integration Tests

on:
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  trigger:
    # Dependabot pull requests use the separate Dependabot secret store, so
    # `secrets.INTEGRATION_TOKEN` resolves to an empty string and the dispatch
    # can never succeed. Skip them instead of failing every dependency bump.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger integration tests
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "::notice::Fork pull request cannot access INTEGRATION_TOKEN; skipping integration dispatch."
              exit 0
            fi
            echo "::error::INTEGRATION_TOKEN is not configured for this repository."
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            gh api repos/xPyD-hub/xPyD-integration/dispatches \
              -f event_type=pr-check \
              -f "client_payload[repo]=xPyD-proxy" \
              -f "client_payload[ref]=$HEAD_REF"
          else
            gh api repos/xPyD-hub/xPyD-integration/dispatches \
              -f event_type=release-check \
              -f "client_payload[repo]=xPyD-proxy" \
              -f "client_payload[version]=$RELEASE_TAG"
          fi
