name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash .github/scripts/retry.sh 3 pip install -e ".[dev]"
      - run: bash .github/scripts/retry.sh 3 python -m pytest tests/unit/ -v --tb=short --timeout=120
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: bash .github/scripts/retry.sh 3 pip install -e ".[dev]" ruff isort
      - run: bash .github/scripts/retry.sh 3 ruff check .
      - run: bash .github/scripts/retry.sh 3 isort --check-only --diff --skip xpyd .
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: bash .github/scripts/retry.sh 3 bash -c 'pip install build && python -m build'
      - run: bash .github/scripts/retry.sh 3 bash -c 'pip install dist/*.whl'
      - run: bash .github/scripts/retry.sh 3 bash -c 'xpyd --help && xpyd --version'
      - run: bash .github/scripts/retry.sh 3 bash -c 'pip install pytest pytest-asyncio && python -m pytest tests/unit/ -v --tb=short'