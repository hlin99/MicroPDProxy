name: Scheduler matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: scheduler-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  disaggregated:
    name: Disaggregated 4P2D scheduler semantics
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.cache/xpyd-nixl-wheels
            /tmp/tokenizers/facebook/opt-125m
          key: scheduler-vllm-0.25.2.dev202607190821-nixl-1.3.0-opt-125m
      - name: Install xPyD and vLLM CPU
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
          PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}" \
            bash examples/aggregated/opt-125m-cpu/install_vllm_cpu.sh
      - name: Build CPU NIXL with UCX
        run: |
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          bash examples/disaggregated/opt-125m-cpu-nixl/install_nixl_cpu.sh
      - name: Download OPT-125M
        run: bash examples/aggregated/opt-125m-cpu/download_model.sh
      - name: Run 4P2D scheduler matrix
        run: |
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          bash examples/disaggregated/opt-125m-cpu-nixl-scheduler-4p2d/run_all.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scheduler-matrix-4p2d-logs
          path: examples/disaggregated/opt-125m-cpu-nixl-scheduler-4p2d/logs/
