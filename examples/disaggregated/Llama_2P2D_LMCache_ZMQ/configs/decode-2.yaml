# pd_peer_host is the loopback prefill peer host placeholder for this decode receiver.
local_cpu: false
max_local_cpu_size: 0

enable_pd: true
transfer_channel: "nixl"
pd_role: "receiver"
pd_peer_host: "127.0.0.1"
pd_peer_init_port: 7301
pd_peer_alloc_port: 7401
pd_buffer_size: 2147483648
pd_buffer_device: "cpu"
nixl_backends: [UCX]
pd_backend_mode: "async"
pd_max_prefill_len: 16384
pd_allocation_timeout_sec: 10
