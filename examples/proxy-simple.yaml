# MicroPDProxy — Minimal flat-list config (backward compatible)
#
# If you don't need topology expansion, you can list instance addresses
# directly. PREFILL_HOST and DECODE_HOST are non-sensitive placeholders;
# prefill entries are prefill backend hosts, decode entries are decode backend
# hosts, and `port` is the proxy listen port.

model: /path/to/model
port: 8868

prefill:
  - "PREFILL_HOST:8100"

decode:
  - "DECODE_HOST_1:8200"
  - "DECODE_HOST_2:8200"

scheduling: loadbalanced
